name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  quality:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Pytype
        run: uv run pytype src/atitd_tile_cache
