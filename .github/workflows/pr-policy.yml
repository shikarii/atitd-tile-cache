name: PR Policy

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]

jobs:
  enforce-issue-linking:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Validate PR body issue links
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const issueUrlRegex = /https:\/\/github\.com\/shikarii\/atitd-tile-cache\/issues\/\d+/i;
            const closesUrlRegex = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+https:\/\/github\.com\/shikarii\/atitd-tile-cache\/issues\/\d+/i;

            if (!issueUrlRegex.test(body)) {
              core.setFailed("PR body must include a full issue URL.");
              return;
            }
            if (!closesUrlRegex.test(body)) {
              core.setFailed("PR body must include a closing statement with full issue URL.");
              return;
            }
